<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="login.css" />
  <title>Login Page</title>
  <style>
    canvas {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      z-index: 0;
    }
    .card {
      position: relative;
      z-index: 1;
    }
  </style>
</head>

<body>

  <canvas id="bg"></canvas>

  <div class="card">
    <p>PASSWORD RECOVERY</p>
    <hr>
    <p>Password re-sent to registered mail ID.</p>
    <a href="index.html" class="a1"><button>Return to Login</button></a>
  </div>

  <script>
    const canvas = document.getElementById('bg');
    const ctx    = canvas.getContext('2d');

    canvas.width  = window.innerWidth;
    canvas.height = window.innerHeight;

    const CELL  = 36;   // grid cell size in px
    const BAR   = 3;    // bar thickness
    const ALPHA = 0.07; // subtle

    ctx.fillStyle = '#000';
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    ctx.fillStyle = `rgba(255, 255, 255, ${ALPHA})`;

    // Vertical bars
    for (let x = 0; x < canvas.width; x += CELL) {
      ctx.fillRect(x, 0, BAR, canvas.height);
    }

    // Horizontal bars
    for (let y = 0; y < canvas.height; y += CELL) {
      ctx.fillRect(0, y, canvas.width, BAR);
    }
  </script>

</body>
</html>
